name: Publish VOXMail image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Release or prerelease tag to publish
        required: true
        default: latest
        type: string
      source_ref:
        description: Branch, tag, or commit to test and publish exactly
        required: true
        default: main
        type: string
      promote_latest:
        description: Move the production latest alias to this non-latest release
        required: true
        default: false
        type: boolean

# Queue publications for this repository in one group so different tags cannot
# race during alias promotion. `queue: max` retains up to 100 pending runs
# instead of replacing earlier pending publications with the newest run.
concurrency:
  group: voxmail-publish-${{ github.repository }}
  queue: max

permissions:
  actions: read
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/voxmail
  # A marked push publishes the exact pushed commit as latest. Manual runs
  # retain their explicit release/prerelease tag and source ref.
  TAG: ${{ inputs.tag || 'latest' }}
  SOURCE_REF: ${{ inputs.source_ref || github.sha }}

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '(publish)') }}
    name: Verify exact source commit
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          # Keep room for the six-character architecture suffix on release aliases.
          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,121}$ ]]; then
            echo "invalid image tag: $TAG" >&2
            exit 1
          fi
          test -n "$SOURCE_REF"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - id: source
        name: Record source revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Vet exact source
        run: go vet ./...

      - name: Test exact source
        run: go test -race -count=1 ./...

      - name: Compile E2E harness
        run: go build ./tests/e2e

      - name: Check Dockerfile exact source
        run: docker build --check -f Dockerfile .

  require-ci:
    name: Require CI checks for exact source
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Acceptance tooling belongs to this immutable workflow revision;
          # older application sources may not contain the gate script.
          ref: ${{ github.workflow_sha }}
      - name: Require successful CI producer for exact source
        run: scripts/require-ci.sh "$SOURCE_SHA"

  build-native:
    permissions:
      actions: read
      contents: read
      packages: write
    name: Build ${{ matrix.arch }} natively
    needs: [verify, require-ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: build
        name: Build, attest, and push a unique staging image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: true
          tags: ${{ env.IMAGE }}:staging-${{ needs.verify.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ needs.verify.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
          build-args: |
            VOXMAIL_REVISION=${{ needs.verify.outputs.source_sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=voxmail-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=voxmail-${{ matrix.arch }}

      - name: Capture build output digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$BUILD_DIGEST" > digest

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voxmail-digest-${{ matrix.arch }}
          path: digest
          retention-days: 14

  scan-native:
    name: Scan ${{ matrix.arch }} image
    needs: [verify, build-native]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: voxmail-digest-${{ matrix.arch }}
          path: digests

      - id: image
        name: Resolve immutable scan reference
        shell: bash
        run: |
          set -euo pipefail
          digest="$(cat digests/digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Record scan artifact identity
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          SCAN_IMAGE: ${{ steps.image.outputs.ref }}
          SCAN_PLATFORM: linux/${{ matrix.arch }}
        run: python3 scripts/scan-evidence.py prepare scan-evidence

      - name: Scan architecture image for fixed high/critical vulnerabilities
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: json
          output: scan-evidence/trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

      - name: Record outcome and validate machine-readable scan report
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python3 scripts/scan-evidence.py finish scan-evidence

      - name: Retain scan evidence even when publication is blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voxmail-scan-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: scan-evidence
          if-no-files-found: error
          retention-days: 30

  runtime-native:
    name: Runtime-test ${{ matrix.arch }} digest
    needs: [verify, build-native, scan-native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: env.TAG != 'latest'
        with:
          go-version: '1.26.x'
          cache: true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: voxmail-digest-${{ matrix.arch }}
          path: digests

      - name: Run SIP peer smoke against exact build digest
        id: sip
        shell: bash
        run: |
          set -euo pipefail
          digest="$(cat digests/digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker run --rm --network host \
            --platform "linux/${{ matrix.arch }}" \
            --entrypoint /usr/local/bin/voxmail-sip-peer-smoke \
            "${IMAGE}@${digest}"

      - name: Require real-model acceptance before versioned publication
        id: models
        if: env.TAG != 'latest'
        shell: bash
        run: |
          set -euo pipefail
          digest="$(cat digests/digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          scripts/model-acceptance.sh "${IMAGE}@${digest}" "linux/${{ matrix.arch }}"


      - name: Record exact runtime acceptance outcome
        if: always()
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          ACCEPT_PLATFORM: linux/${{ matrix.arch }}
          SIP_OUTCOME: ${{ steps.sip.outcome }}
          MODEL_OUTCOME: ${{ steps.models.outcome }}
        run: python3 scripts/release-evidence.py runtime acceptance-evidence
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voxmail-acceptance-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-evidence
          if-no-files-found: error
          retention-days: 30

  publish-manifest:
    permissions:
      actions: read
      contents: read
      packages: write
    name: Publish multi-architecture manifest
    outputs:
      manifest_digest: ${{ steps.release.outputs.digest }}
      latest_outcome: ${{ steps.latest.outcome }}
    needs: [verify, require-ci, build-native, scan-native, runtime-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: voxmail-*
          path: evidence
      - name: Validate exact-source scan and acceptance evidence before alias changes
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          REQUIRE_CI_RESULT: ${{ needs.require-ci.result }}
          BUILD_NATIVE_RESULT: ${{ needs.build-native.result }}
          SCAN_NATIVE_RESULT: ${{ needs.scan-native.result }}
          RUNTIME_NATIVE_RESULT: ${{ needs.runtime-native.result }}
        run: python3 scripts/release-evidence.py validate evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: voxmail-digest-amd64
          path: digests/amd64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: voxmail-digest-arm64
          path: digests/arm64

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"

      - name: Install pinned remote image tagger
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1

      - name: Stage manifest from captured architecture digests
        id: manifest
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          set -euo pipefail
          amd64_digest="$(cat digests/amd64/digest)"
          arm64_digest="$(cat digests/arm64/digest)"
          for digest in "$amd64_digest" "$arm64_digest"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          staging_tag="staging-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-index"
          docker buildx imagetools create \
            --tag "${IMAGE}:${staging_tag}" \
            "${IMAGE}@${amd64_digest}" \
            "${IMAGE}@${arm64_digest}"
          manifest_digest="$(crane digest "${IMAGE}:${staging_tag}")"
          [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$manifest_digest" >> "$GITHUB_OUTPUT"

      - name: Enforce immutable version aliases and promote accepted digests
        shell: bash
        env:
          SCAN_RESULT: ${{ needs.scan-native.result }}
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: scripts/promote-architecture-tags.sh "$SCAN_RESULT" "$IMAGE" "$TAG" digests "$MANIFEST_DIGEST"

      - name: Inspect published manifest and record release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_digest="$(crane digest "${IMAGE}:${TAG}")"
          [[ "$release_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$release_digest" == "${{ steps.manifest.outputs.digest }}" ]]
          echo "digest=$release_digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}@${release_digest}"

      - name: Promote production latest alias
        id: latest
        if: ${{ inputs.promote_latest && inputs.tag != 'latest' }}
        shell: bash
        run: |
          set -euo pipefail
          release_digest="$(crane digest "${IMAGE}:${TAG}")"
          crane tag "${IMAGE}@${release_digest}" latest
          [[ "$(crane digest "${IMAGE}:latest")" == "$release_digest" ]]


  release-summary:
    name: Record release identities and acceptance
    if: ${{ always() && needs.verify.result != 'skipped' }}
    needs: [verify, require-ci, build-native, scan-native, runtime-native, publish-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: voxmail-*
          path: evidence
      - name: Write machine-readable and human-readable release record
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          REQUIRE_CI_RESULT: ${{ needs.require-ci.result }}
          BUILD_NATIVE_RESULT: ${{ needs.build-native.result }}
          SCAN_NATIVE_RESULT: ${{ needs.scan-native.result }}
          RUNTIME_NATIVE_RESULT: ${{ needs.runtime-native.result }}
          PUBLISH_MANIFEST_RESULT: ${{ needs.publish-manifest.result }}
          MANIFEST_DIGEST: ${{ needs.publish-manifest.outputs.manifest_digest }}
          LATEST_OUTCOME: ${{ needs.publish-manifest.outputs.latest_outcome }}
        run: python3 scripts/release-evidence.py summary evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voxmail-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-summary
          if-no-files-found: error
          retention-days: 90
