name: Publish VOXMail image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/voxmail
  TAG: ${{ inputs.tag }}

jobs:
  build-native:
    name: Build ${{ matrix.arch }} natively
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=voxmail-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=voxmail-${{ matrix.arch }}

  publish-manifest:
    name: Publish multi-architecture manifest
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Combine native images in GHCR
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
      - name: Inspect published manifest
        run: docker buildx imagetools inspect "${IMAGE}:${TAG}"
      - name: Move latest alias to this release
        if: inputs.tag != 'latest'
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:latest"
