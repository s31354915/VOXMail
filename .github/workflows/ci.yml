name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# PR run metadata names the head SHA; test that exact source, not a synthetic merge.
env:
  VOXMAIL_CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  unit:
    name: Go unit tests and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VOXMAIL_CI_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact checked-out source
        run: test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$VOXMAIL_CI_SOURCE_SHA"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: E2E harness compiles
        run: go build ./tests/e2e
      - name: Documentation contract
        run: scripts/docs-contract.sh
      - name: Dockerfile is well-formed
        run: docker build --check -f Dockerfile .

  e2e:
    name: End-to-end container tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: unit
    env:
      VOXMAIL_E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VOXMAIL_E2E_SIP_PEER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VOXMAIL_CI_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact checked-out source
        run: test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$VOXMAIL_CI_SOURCE_SHA"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
      - name: Run E2E suite (builds image, container, restart persistence, cleanup)
        env:
          VOXMAIL_E2E_ARTIFACT_DIR: ${{ runner.temp }}/voxmail-e2e-artifacts
        run: scripts/e2e.sh
      - name: Verify effective build context and production Go builder
        run: python3 scripts/check-build-context.py
      - name: Upload redacted E2E diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voxmail-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/voxmail-e2e-artifacts
          if-no-files-found: ignore
      - name: No docker residue left behind
        if: always()
        run: |
          test -z "$(docker ps -aqf name=^/voxmail-e2e-${VOXMAIL_E2E_RUN_ID}$)" || { docker ps -aqf name=^/voxmail-e2e-${VOXMAIL_E2E_RUN_ID}$; exit 1; }
          test -z "$(docker volume ls -qf name=^voxmail-e2e-data-${VOXMAIL_E2E_RUN_ID}$)" || { docker volume ls -qf name=^voxmail-e2e-data-${VOXMAIL_E2E_RUN_ID}$; exit 1; }
          if docker image inspect "voxmail-e2e:${VOXMAIL_E2E_RUN_ID}" >/dev/null 2>&1; then echo "image voxmail-e2e:${VOXMAIL_E2E_RUN_ID} was not removed"; exit 1; fi

  providers:
    name: Controlled IMAP and SMTP integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VOXMAIL_CI_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact checked-out source
        run: test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$VOXMAIL_CI_SOURCE_SHA"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install real mbsync
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y isync
      - name: Exercise loopback providers with verified private CA
        run: go test -race -count=1 -tags integration -timeout 5m -v ./tests/providers

  python-dependencies:
    name: Hashed Python runtime dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: python:3.11-slim-bookworm@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89
    steps:
      - name: Install Git for exact source verification
        run: |
          apt-get update
          apt-get install --no-install-recommends -y git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VOXMAIL_CI_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact checked-out source
        run: test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$VOXMAIL_CI_SOURCE_SHA"
      - name: Verify both wheel targets, native imports and tamper rejection
        run: python scripts/check-python-lock.py

  browser:
    name: Chromium console flows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VOXMAIL_CI_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact checked-out source
        run: test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$VOXMAIL_CI_SOURCE_SHA"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install locked browser dependencies
        working-directory: tests/browser
        run: npm ci
      - name: Verify generated console matches its modules
        run: |
          npm ci --prefix internal/web/console
          npm run --prefix internal/web/console check
          node --test internal/web/console/folder-preview.test.mjs
      - name: Install Chromium and system dependencies
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium
      - name: Test disposable offline console
        run: scripts/browser-test.sh
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voxmail-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/browser/test-results
            tests/browser/playwright-report
          if-no-files-found: ignore
