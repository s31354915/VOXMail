name: Real model acceptance

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source ref to build and accept with real speech models
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  models:
    name: Real speech on ${{ matrix.arch }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build native final image from recorded source
        run: |
          git rev-parse HEAD
          docker build --platform "linux/${{ matrix.arch }}" -t voxmail-model-acceptance:${{ matrix.arch }} .
      - name: Accept with verified real models and no container network
        run: scripts/model-acceptance.sh voxmail-model-acceptance:${{ matrix.arch }} linux/${{ matrix.arch }}
